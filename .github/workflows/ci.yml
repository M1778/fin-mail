name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake bison flex python3 pipx clang
          pipx install conan

      - name: Install LLVM 22
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-22-dev

      - name: Build finc
        run: |
          export PATH="$HOME/.local/bin:/usr/lib/llvm-22/bin:$PATH"
          git clone --depth 1 https://github.com/M1778/Fin.git /tmp/Fin
          cd /tmp/Fin && ./build.sh --release --no-test

      - name: Type-check library
        run: |
          export PATH="/tmp/Fin/build:$PATH"
          finc --version
          finc -I src src/mail.fin

      - name: Build and run unit tests
        run: |
          export PATH="/tmp/Fin/build:$PATH"
          finc -I src tests/test_mail.fin -o test_mail
          ./test_mail

      - name: Build examples and run live SMTP tests
        run: |
          export PATH="/tmp/Fin/build:$PATH"
          finc -I src examples/basic.fin -o example_basic
          ./example_basic > /dev/null
          finc -I src examples/send_local.fin -o example_send_local
          finc -I src examples/send_local_auth.fin -o example_send_auth
          python3 tests/live_smtp.py
